[workspace]
resolver = "2"
members = [
    "amstr-game",
    "amstr-token",
    "amstr-treasury",
    "amstr-staking",
    "integration-tests",
]

[workspace.dependencies]
near-sdk = "5.30.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
sha2 = "0.10"
primitive-types = { version = "0.10", default-features = false }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
overflow-checks = true
